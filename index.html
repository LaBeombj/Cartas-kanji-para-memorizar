<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjetas de Estudio - Kanji</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid rgba(255,255,255,0.3);
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .btn:hover {
            background: rgba(255,255,255,0.3);
            border-color: rgba(255,255,255,0.5);
            transform: translateY(-2px);
        }

        .btn.active {
            background: rgba(255,255,255,0.4);
            border-color: rgba(255,255,255,0.6);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .card {
            perspective: 1000px;
            height: 200px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .card-front {
            background: rgba(255,255,255,0.95);
            color: #333;
        }

        .card-back {
            background: rgba(255,255,255,0.9);
            color: #333;
            transform: rotateY(180deg);
            flex-direction: column;
            padding: 20px;
        }

        .kanji {
            font-size: 4rem;
            font-weight: bold;
            color: #2d3748;
        }

        .meaning {
            font-size: 1.5rem;
            font-weight: bold;
            color: #4a5568;
            margin-bottom: 10px;
        }

        .reading {
            font-size: 1.1rem;
            color: #718096;
            margin-bottom: 8px;
        }

        .level {
            font-size: 0.9rem;
            color: #a0aec0;
            font-style: italic;
        }

        .progress {
            background: rgba(255,255,255,0.2);
            border-radius: 25px;
            padding: 20px;
            text-align: center;
            color: white;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .progress-bar {
            background: rgba(255,255,255,0.3);
            height: 10px;
            border-radius: 5px;
            margin: 10px 0;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #48bb78, #38a169);
            height: 100%;
            border-radius: 5px;
            transition: width 0.3s ease;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .cards-grid {
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: 20px;
            }
            
            .kanji {
                font-size: 3rem;
            }
        }
    </style>
</head>

        let studiedCards = new Set();
        let currentFilter = 'all';

        function createCard(data, index) {
            return `
                <div class="card" data-level="${data.level}" data-index="${index}">
                    <div class="card-inner" onclick="flipCard(this, ${index})">
                        <div class="card-front">
                            <div class="kanji">${data.kanji}</div>
                        </div>
                        <div class="card-back">
                            <div class="meaning">${data.meaning}</div>
                            <div class="reading"><strong>Kunyomi:</strong> ${data.kunyomi}</div>
                            <div class="reading"><strong>Onyomi:</strong> ${data.onyomi}</div>
                            <div class="level">Nivel: ${data.level}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCards() {
            const grid = document.getElementById('cardsGrid');
            let filteredData = currentFilter === 'all' ? kanjiData : kanjiData.filter(item => item.level === currentFilter);
            
            grid.innerHTML = filteredData.map((data, index) => {
                const originalIndex = kanjiData.indexOf(data);
                return createCard(data, originalIndex);
            }).join('');

            updateProgress();
        }

        function flipCard(cardInner, index) {
            const card = cardInner.parentElement;
            card.classList.toggle('flipped');
            
            if (card.classList.contains('flipped')) {
                studiedCards.add(index);
                updateProgress();
            }
        }

        function filterCards(level) {
            currentFilter = level;
            
            // Actualizar botones activos
            document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            renderCards();
        }

        function shuffleCards() {
            const grid = document.getElementById('cardsGrid');
            const cards = Array.from(grid.children);
            
            // Algoritmo Fisher-Yates para mezclar
            for (let i = cards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                grid.appendChild(cards[j]);
            }
        }

        function resetCards() {
            studiedCards.clear();
            document.querySelectorAll('.card').forEach(card => {
                card.classList.remove('flipped');
            });
            updateProgress();
        }

        function updateProgress() {
            const totalCards = currentFilter === 'all' ? kanjiData.length : kanjiData.filter(item => item.level === currentFilter).length;
            const studiedCount = studiedCards.size;
            const percentage = totalCards > 0 ? (studiedCount / totalCards) * 100 : 0;
            
            document.getElementById('progressFill').style.width = percentage + '%';
            document.getElementById('studiedCount').textContent = studiedCount;
            document.getElementById('totalCount').textContent = totalCards;
        }

        // Inicializar la aplicación
